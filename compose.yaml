services:
  shortly:
    build:
      context: .
    ports:
      - "${URL_SHORTENER_PORT:-5000}:8000"
    env_file:
      - .env
    volumes:
      - shortly-data:/app/instance
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  shortly-data:
